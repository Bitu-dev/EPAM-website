name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build, backend e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check src scripts
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: npx --yes @redocly/cli@1.34.5 lint docs/openapi.yaml
      - run: bash -n scripts/backup.sh && bash -n scripts/restore.sh
      - run: bun run test
      - run: NITRO_PRESET=node-server bun run build
      # Boots the built server against the real Postgres service and a real SMTP sink; ~35 checks over HTTP.
      - run: node scripts/e2e.mjs
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # GHSA-mrhx-c7xc-m3w5 (zod 3 memory exhaustion on oversized *collections*) is an accepted, documented risk:
      # no endpoint accepts arrays and request bodies are capped at 16 KB. Remove the ignore after upgrading to zod 4.
      - run: bun audit --audit-level=high --ignore GHSA-mrhx-c7xc-m3w5

  image:
    name: Container image build and scan
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: epam-website:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: epam-website:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  codeql:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@v3
