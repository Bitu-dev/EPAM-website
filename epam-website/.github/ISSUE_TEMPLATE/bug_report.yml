name: Bug report
description: Something on the website or admin inbox is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: "What happened, and what did you expect instead?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
  - type: input
    id: where
    attributes:
      label: "Page or URL"
  - type: input
    id: device
    attributes:
      label: "Device and browser"
  - type: markdown
    attributes:
      value: "Please do not paste passwords, tokens or visitors' personal messages into this issue."
