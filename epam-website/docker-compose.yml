# Production stack: Caddy (TLS) -> app (SSR + API) -> PostgreSQL. Nothing but Caddy is reachable from outside.
#   cp .env.example .env   # fill in every CHANGE_ME
#   docker compose up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: epam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: epam
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epam -d epam"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  app:
    build:
      context: .
      target: runtime
    image: epam-website:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://epam:${POSTGRES_PASSWORD}@db:5432/epam
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -base64 48)}
      PUBLIC_URL: ${PUBLIC_URL:-}
      TRUSTED_PROXY_HOPS: "1"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      NOTIFY_TO: ${NOTIFY_TO:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { memory: 512m }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

  # One-off admin tasks:  docker compose --profile tools run --rm tools bun scripts/user.ts list
  tools:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgres://epam:${POSTGRES_PASSWORD}@db:5432/epam
      JWT_SECRET: ${JWT_SECRET}
      USER_PASSWORD: ${USER_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
